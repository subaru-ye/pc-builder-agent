openapi: 3.1.0
info:
  title: PC Builder Agent Product API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    产品 API 契约。P7 会话、run、SSE 与配置读取、P9 分享，以及本地 Supabase Auth 账号接口均已实现。
    浏览器不得绕过本契约直接依赖 ADK/A2A 线格式。
servers:
  - url: /
    description: 同源入口;本地由 Next.js rewrite 转发至 Go :8082
tags:
  - name: health
    description: 进程与依赖健康状态
  - name: sessions
    description: 匿名产品会话、消息与需求确认
  - name: runs
    description: 后台 Agent 运行与 SSE 事件
  - name: builds
    description: 配置版本、diff 与 Markdown 导出
  - name: shares
    description: 只读分享的创建、撤销与公开读取
  - name: preferences
    description: 用户显式保存的跨会话装机偏好（查看、改正、删除）
  - name: auth
    description: 本地 Supabase Auth 账号与服务端认证会话
paths:
  /healthz:
    get:
      summary: 检查 API 进程存活
      tags: [health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      summary: 检查完整依赖就绪状态
      tags: [health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: 完整依赖可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪或处于降级状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      summary: 读取账号功能与当前登录状态
      tags: [auth]
      operationId: getAuthState
      responses:
        "200":
          description: 当前身份；未启用或未登录也返回 200
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/register:
    post:
      summary: 邮箱密码注册并认领当前匿名数据
      tags: [auth]
      operationId: registerAccount
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: 注册成功并设置服务端认证会话 Cookie
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      summary: 邮箱密码登录并认领当前匿名数据
      tags: [auth]
      operationId: loginAccount
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      summary: 退出登录并旋转匿名身份
      tags: [auth]
      operationId: logoutAccount
      responses:
        "204": {description: 已退出}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/profile:
    patch:
      summary: 更新显示名称
      tags: [auth]
      operationId: updateAccountProfile
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRequest"}
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password/change:
    post:
      summary: 校验当前密码后修改密码
      tags: [auth]
      operationId: changeAccountPassword
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeRequest"}
      responses:
        "204": {description: 密码已修改，当前会话已替换}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/sessions:
    post:
      summary: 创建匿名产品会话
      tags: [sessions]
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 会话已创建;必要时同时设置匿名身份 cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      summary: 列出当前匿名用户的会话
      tags: [sessions]
      operationId: listSessions
      parameters:
        - in: query
          name: archived
          schema: {type: boolean, default: false}
          description: true 仅列出已归档会话，默认仅列出未归档会话。
      responses:
        "200":
          description: 当前匿名用户的会话
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, sessions]
                properties:
                  schema_version: {type: integer, const: 1}
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/SessionSummary"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    patch:
      summary: 重命名或归档/恢复自己的对话，不触发模型运行
      tags: [sessions]
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: {type: string, minLength: 1, maxLength: 80}
                archived: {type: boolean}
      responses:
        "200":
          description: 更新后的会话
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      summary: 永久删除自己的对话及消息、配置版本、分享；运行中返回 409
      tags: [sessions]
      operationId: deleteSession
      responses:
        "204":
          description: 已删除
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      summary: 读取一个产品会话
      tags: [sessions]
      operationId: getSession
      responses:
        "200":
          description: 会话详情、消息、待确认需求和活动 run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 发送消息并启动初筛或改单 run
      tags: [sessions]
      operationId: createMessageRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, text]
              properties:
                schema_version: {type: integer, const: 1}
                text: {type: string, minLength: 1, maxLength: 4000}
      responses:
        "200":
          description: 幂等命中已完成的同一 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: run 已开始或幂等命中运行中的 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/requirement-state:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    patch:
      summary: 增量编辑当前会话需求
      tags: [sessions]
      operationId: updateRequirementState
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        独立原子草稿编辑事务:复用共享 Reducer、权限与幂等约束,按
        expected_revision 防止覆盖并发修改;只更新草稿 RequirementState 与
        revision,不创建 AgentRun、不改变 phase。Builder 运行期间同样可用
        (运行中的 Builder 只读取启动时冻结的快照;确认快照与历史配置不变)。
        生成中确认/生成请求仍被服务端硬拒绝;编辑后以响应中的三轴状态为准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, operations]
              properties:
                expected_revision: {type: integer, minimum: 0}
                operations:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: {$ref: "#/components/schemas/RequirementOperation"}
      responses:
        "200":
          description: 保存后的完整会话真值
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "409":
          description: 需求版本已变化或会话正在执行任务，需重新读取会话
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/requirement:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    patch:
      summary: 完整替换待确认需求
      tags: [sessions]
      operationId: replacePendingRequirement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: 只允许 requirement_ready;请求体为完整替换而非 merge patch。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequirementSpec"}
      responses:
        "200":
          description: 严格校验并保存后的需求
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RequirementSpec"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/requirement/confirm:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 确认需求并启动生成 run(唯一 Builder admission)
      tags: [sessions]
      operationId: confirmRequirement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        唯一的原子 confirm-and-start 入口:同一事务校验 readiness/revision/核定
        预览 hash,冻结不可变确认快照(review_spec + review_hash)与本 run 的完整
        Builder 执行载荷(builder_input_payload + builder_input_hash),并创建唯一
        build run。聊天文字、模型 signal、旧 phase 或恢复路径都不能替代本入口。
        幂等:相同 Idempotency-Key + 相同请求体重放返回原 run;相同 key 不同请求
        返回 409。retry_of_run_id 仅用于失败重试:目标必须属于本会话、kind=build
        且已失败,其确认快照的 review_hash 仍与当前核定预览一致;重试复用快照,选型上下文(需求状态、基线草稿、上一提案)整体继承目标 run
        的冻结载荷,仅替换本轮 run 标识并另冻新载荷与新 hash。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, expected_revision, expected_review_hash]
              properties:
                schema_version: {type: integer, const: 2}
                expected_revision:
                  type: integer
                  minimum: 0
                  description: 用户打开核定面板时看到的草稿修订号。
                expected_review_hash:
                  type: string
                  minLength: 1
                  description: 来自最新服务端核定预览(session DTO 的 review_hash)。revision 不变但默认规则/配置范围变化时该 hash 也会变化。
                retry_of_run_id:
                  oneOf:
                    - {type: string, format: uuid}
                    - {type: "null"}
                  description: 仅失败重试时传目标 build run ID;省略表示新确认。
      responses:
        "200":
          description: 幂等命中已完成 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: build run 已开始
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "409":
          description: |
            revision 变化(requirement_revision_conflict)、核定预览失效
            (requirement_review_conflict,含默认/配置范围变化)、存在活动运行
            (session_busy)、重试目标无效(invalid_retry_target)或幂等冲突。
            返回最新会话供用户重新核定。
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: readiness 不完整(requirement_not_ready),响应 detail 指向 requirement_readiness。
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/RunID"
    post:
      summary: 请求取消当前运行
      tags: [runs]
      operationId: cancelRun
      description: |
        对 running 状态的 run 置位取消标志并取消服务端执行;幂等,重复调用返回当前状态。
        取消成功后 run 终态为 interrupted,会话立即恢复可用;run 已终态时为无操作。
        SSE 侧随后发出 run.cancelled 与 run.completed(interrupted)。
      responses:
        "202":
          description: 取消请求已受理(或 run 已终态,原样返回)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: 读取后台 run 状态
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: 当前匿名用户所属 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}/feedback:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: 读取自己的运行反馈
      tags: [runs]
      operationId: getRunFeedback
      responses:
        "200":
          description: 当前反馈；未提交时为 null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      summary: 提交或修改已结束运行的负反馈
      description: 同一运行只保留一份反馈；相同内容重复提交不重复创建，修改原因不更换证据。反馈不等于已批准的评估标准答案。
      tags: [runs]
      operationId: submitRunFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackInput"}
      responses:
        "200":
          description: 反馈已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/preferences:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 把当前会话的一个需求字段保存为跨会话偏好
      description: >-
        用户显式保存：值、强度与来源一律取自服务端需求状态，请求体只提供字段与归属对象。
        服务端核验会话归属、原始用户消息与原文引用，拒绝临时例外、不确定/推断证据与面板编辑来源。
        同字段同值重复保存幂等返回 unchanged；值变化构成改主意，返回 superseded。偏好只是待确认建议，不是自动生效约束。
      tags: [preferences]
      operationId: saveSessionPreference
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreferenceSaveInput"}
      responses:
        "200":
          description: 保存结果（action = created | superseded | unchanged）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreferenceSaveResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/preferences:
    get:
      summary: 列出当前身份的全部 active 跨会话偏好
      description: 含登录账号认领的匿名 owner；本人(self)在前。仅返回 active 记录，不含已删除或已被取代的墓碑。
      tags: [preferences]
      operationId: listPreferences
      responses:
        "200":
          description: 偏好列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreferenceListResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/preferences/{preference_id}:
    delete:
      summary: 删除一条跨会话偏好
      description: 物理删除（含改主意 supersede 链的墓碑）；跨身份未命中统一 404。
      tags: [preferences]
      operationId: deletePreference
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: preference_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: 已删除
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: Last-Event-ID
        in: header
        required: false
        description: SSE 重连游标;从其后一条事件开始。
        schema: {type: string}
    get:
      summary: 订阅并重放 run 事件
      tags: [runs]
      operationId: streamRunEvents
      responses:
        "200":
          description: 事件细节见 SSE事件协议.md
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
            X-Accel-Buffering:
              schema: {type: string, const: "no"}
          content:
            text/event-stream:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 列出会话的配置版本
      tags: [builds]
      operationId: listBuilds
      responses:
        "200":
          description: 版本树摘要,按 version 升序
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, builds]
                properties:
                  schema_version: {type: integer, const: 1}
                  builds:
                    type: array
                    items: {$ref: "#/components/schemas/BuildSummary"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    get:
      summary: 读取聚合配置版本
      tags: [builds]
      operationId: getBuild
      responses:
        "200":
          description: 聚合配置读模型
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuildView"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/diff:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: from
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      - name: to
        in: query
        required: true
        schema: {type: integer, minimum: 1}
    get:
      summary: 比较任意两个配置版本
      tags: [builds]
      operationId: getBuildDiff
      responses:
        "200":
          description: 两版本逐品类 diff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuildDiff"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/export.md:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    get:
      summary: 下载一个版本的 Markdown
      tags: [builds]
      operationId: exportBuildMarkdown
      responses:
        "200":
          description: 与 cmd/builds 共用 presenter 的 Markdown
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/markdown; charset=utf-8:
              schema: {type: string}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/shares:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    post:
      summary: 创建固定版本的只读分享
      tags: [shares]
      operationId: createBuildShare
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 新分享;原始 token 只在响应和 URL 中出现
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Share"}
        "200":
          description: 相同幂等键的既有分享
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Share"}
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      summary: 列出当前用户对固定版本创建过的分享
      tags: [shares]
      operationId: listBuildShares
      responses:
        "200":
          description: 包含活动和已撤销记录;不返回 token 或 URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, shares]
                properties:
                  schema_version: {type: integer, const: 1}
                  shares:
                    type: array
                    items: {$ref: "#/components/schemas/ShareRecord"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/shares/{share_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/ShareID"
    delete:
      summary: 按所有者分享 ID 撤销旧链接
      tags: [shares]
      operationId: revokeBuildShareById
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 已撤销;重复撤销保持幂等
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    delete:
      summary: 撤销当前用户拥有的分享
      tags: [shares]
      operationId: revokeBuildShare
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 已撤销;重复撤销保持幂等
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/public/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      summary: 公开读取一份只读配置
      tags: [shares]
      operationId: getPublicBuildShare
      security: []
      responses:
        "200":
          description: 不含会话、用户、聊天与内部 ID 的公开配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicBuildView"}
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/public/shares/{token}/export.md:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      summary: 公开下载固定分享版本的 Markdown
      tags: [shares]
      operationId: exportPublicBuildShareMarkdown
      security: []
      responses:
        "200":
          description: 与所有者导出和 cmd/builds 共用 presenter
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/markdown; charset=utf-8:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    anonymousCookie:
      type: apiKey
      in: cookie
      name: pcb_anonymous_id
    authSessionCookie:
      type: apiKey
      in: cookie
      name: pcb_auth_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    SessionID:
      name: session_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RunID:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Version:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ShareToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    ShareID:
      name: share_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC problem details;404 同时用于不存在与无权访问
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, const: ok}
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, status, dependencies]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, enum: [ready, degraded, unavailable]}
        dependencies:
          type: object
          additionalProperties: false
          required: [postgres, redis, buildsvc]
          properties:
            postgres: {type: string, enum: [ok, unavailable]}
            redis: {type: string, enum: [ok, degraded, unavailable]}
            buildsvc: {type: string, enum: [ok, unavailable]}
            auth: {type: string, enum: [ok, unavailable]}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          enum:
            - invalid_request
            - not_found
            - session_busy
            - invalid_session_phase
            - schema_validation_failed
            - upstream_unavailable
            - context_expired
            - run_timeout
            - run_interrupted
            - run_active
            - run_cancelled
            - generation_failed
            - events_expired
            - internal_error
            - daily_budget_exceeded
            - feedback_unavailable
            - invalid_retry_target
            - requirement_not_ready
            - requirement_review_conflict
            - requirement_revision_conflict
            - requirement_state_unsupported
            - model_authentication_failed
            - model_quota_exhausted
            - model_rate_limited
            - model_timeout
            - preference_unavailable
            - preference_not_savable
            - preference_invalid
            - auth_disabled
            - auth_invalid_credentials
            - auth_email_exists
            - auth_weak_password
            - auth_session_expired
            - auth_unavailable
        request_id: {type: string}
    Account:
      type: object
      additionalProperties: false
      required: [id, email, display_name, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1, maxLength: 40}
        created_at: {type: string, format: date-time}
    AuthState:
      type: object
      additionalProperties: false
      required: [schema_version, enabled, authenticated, account, claimed_session_count]
      properties:
        schema_version: {type: integer, const: 1}
        enabled: {type: boolean}
        authenticated: {type: boolean}
        account:
          oneOf:
            - {$ref: "#/components/schemas/Account"}
            - {type: "null"}
        claimed_session_count: {type: integer, minimum: 0}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [schema_version, email, password, display_name]
      properties:
        schema_version: {type: integer, const: 1}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 10, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 40}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [schema_version, email, password]
      properties:
        schema_version: {type: integer, const: 1}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128}
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [schema_version, display_name]
      properties:
        schema_version: {type: integer, const: 1}
        display_name: {type: string, minLength: 1, maxLength: 40}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, current_password, new_password, confirm_password]
      properties:
        schema_version: {type: integer, const: 1}
        current_password: {type: string, minLength: 1, maxLength: 128}
        new_password: {type: string, minLength: 10, maxLength: 128}
        confirm_password: {type: string, minLength: 10, maxLength: 128}
    SessionPhase:
      type: string
      enum: [collecting, requirement_ready, building, ready, changing, error]
    SessionSummary:
      type: object
      additionalProperties: false
      required: [schema_version, id, title, phase, created_at, updated_at, version_count]
      properties:
        status_label: {type: string, description: 服务端提供的细化状态文案；省略时使用阶段名称}
        schema_version: {type: integer, const: 1}
        id: {type: string}
        title: {type: string}
        archived: {type: boolean, description: 是否已归档；旧客户端未提供时视为 false}
        phase: {$ref: "#/components/schemas/SessionPhase"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version_count: {type: integer, minimum: 0}
    Session:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          required: [messages, pending_requirement, requirement_state, requirement_readiness, review_spec, review_hash, effective_budget_ceiling_cny, requirement_confirmation, build_relation, active_run, last_error, recovery_phase, degraded]
          properties:
            messages:
              type: array
              items: {$ref: "#/components/schemas/Message"}
            proposal: {$ref: "#/components/schemas/SessionProposal"}
            pending_requirement:
              oneOf:
                - $ref: "#/components/schemas/RequirementSpec"
                - type: "null"
            requirement_state:
              oneOf:
                - $ref: "#/components/schemas/RequirementState"
                - type: "null"
            requirement_readiness:
              oneOf:
                - $ref: "#/components/schemas/RequirementReadiness"
                - type: "null"
              description: 后端唯一计算的确定性 readiness 真值;前端只渲染。
            review_spec:
              oneOf:
                - $ref: "#/components/schemas/RequirementSpec"
                - type: "null"
              description: 服务端核定预览(展开有效系统默认后的规范化有效 RequirementSpec v2)。incomplete 时不伪造可确认预览(null)。
            review_hash:
              oneOf:
                - {type: string}
                - {type: "null"}
              description: review_spec 的规范化 SHA256;确认请求的 expected_review_hash 必须来自本字段。
            effective_budget_ceiling_cny:
              oneOf:
                - {type: integer}
                - {type: "null"}
              description: 预算上限展示值 = budget_cny ×(1+budget_flex)取整;预算未表达时为 null。生成侧会计使用精确有理数。
            requirement_confirmation: {$ref: "#/components/schemas/RequirementConfirmation"}
            build_relation: {$ref: "#/components/schemas/BuildRelation"}
            active_run:
              oneOf:
                - $ref: "#/components/schemas/Run"
                - type: "null"
            last_error:
              oneOf:
                - $ref: "#/components/schemas/Problem"
                - type: "null"
            recovery_phase:
              oneOf:
                - type: string
                  enum: [collecting, requirement_ready, ready]
                - type: "null"
            degraded: {type: boolean}
    RequirementReadiness:
      type: object
      required: [status, missing_fields, blocking_conflicts, unsupported_capabilities, next_question, confirmation_eligible, effective_defaults]
      properties:
        status: {type: string, enum: [incomplete, ready]}
        missing_fields:
          type: array
          items: {type: string}
        blocking_conflicts:
          type: array
          items: {type: string}
        unsupported_capabilities:
          type: array
          items: {type: string}
        next_question:
          oneOf:
            - type: object
              required: [reason_code, fields]
              properties:
                reason_code: {type: string}
                fields:
                  type: array
                  items: {type: string}
            - type: "null"
          description: 确定性下一步追问(reason_code + 字段组);ready 时为 null。
        confirmation_eligible: {type: boolean}
        effective_defaults:
          type: array
          description: 本次预览实际展开的系统默认(origin=system_default);默认规则变化会改变 review_hash。
          items:
            type: object
            required: [field, value, origin]
            properties:
              field: {type: string}
              value: {}
              origin: {type: string, enum: [system_default]}
    RequirementConfirmation:
      type: object
      required: [status, confirmed_revision, confirmed_at, confirmed_review_hash]
      properties:
        status:
          type: string
          enum: [unconfirmed, confirmed, modified]
          description: confirmed=当前草稿规范化 review_hash 与最近确认快照相同;modified=存在快照但草稿不同或已不足以投影。
        confirmed_revision:
          oneOf:
            - {type: integer}
            - {type: "null"}
        confirmed_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        confirmed_review_hash:
          oneOf:
            - {type: string}
            - {type: "null"}
        review_diff:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: false
                required: [field, before, after]
                properties:
                  field:
                    type: string
                    description: 需求字段名,与 RequirementState.fields 键一致(含 use_case.* 嵌套路径)。
                  before: {}
                  after: {}
            - type: "null"
          description: |-
            后端按规范化有效字段生成的当前核定预览相对最近确认快照的字段级差异。
            已有确认快照且当前草稿可投影时提供(无差异为空数组);无快照、预览
            不可投影或快照不可解码时为 null。前端只把字段名和值映射为用户可读
            标签,不自行比较 JSON 或重算差异。
    BuildRelation:
      type: object
      required: [status, version, snapshot_id, review_hash, builder_input_hash]
      properties:
        status:
          type: string
          enum: [none, running, current, outdated, failed]
          description: none=从无 build run;running 优先表示活动 Builder;current=最新成功 run 关联当前确认快照且草稿未修改;outdated=已有成功配置但当前确认目标已不同;failed=最近一次 build run 失败(确认快照仍有效,历史成功配置经 version 继续可见)。
        version:
          oneOf:
            - {type: integer}
            - {type: "null"}
          description: 最新成功 build 的配置版本号;从未成功过为 null。
        snapshot_id:
          oneOf:
            - {type: string}
            - {type: "null"}
          description: 关联确认快照 ID(有 build run 时)。
        review_hash:
          oneOf:
            - {type: string}
            - {type: "null"}
          description: 关联确认快照的 review_hash。
        builder_input_hash:
          oneOf:
            - {type: string}
            - {type: "null"}
          description: 最近(或活动)build run 冻结的完整 Builder 载荷规范化 hash;与实际发送载荷比对即 V5。
        retry_run_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: "null"}
          description: |-
            失败重试目标 run ID。仅当最新 build run 已失败(取消中断不算)、确认
            仍有效且当前核定预览与该 run 确认快照一致时给出,否则为 null。确认
            请求的 retry_of_run_id 必须取本字段;前端无值时不得显示重试 CTA,
            也不得从聊天消息、phase 或版本号自行寻找重试目标。
    Message:
      type: object
      additionalProperties: false
      required: [schema_version, id, role, content, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        display_content:
          type: string
          description: 服务端生成的用户可读摘要；展示与复制优先使用非空摘要，原始 content 保留供追溯。
        run_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: "null"}
        created_at: {type: string, format: date-time}
    FeedbackReason:
      type: string
      enum: [unnecessary_question, requirement_mismatch, configuration_issue, price_issue, unclear_explanation, other]
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [schema_version, reason]
      properties:
        schema_version: {type: integer, const: 1}
        reason: {$ref: "#/components/schemas/FeedbackReason"}
        comment: {type: string, maxLength: 2000, description: 选择 other 时必须填写非空说明}
    Feedback:
      type: object
      additionalProperties: false
      required: [id, run_id, reason, comment, fingerprint, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        reason: {$ref: "#/components/schemas/FeedbackReason"}
        comment: {type: string, maxLength: 2000}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FeedbackResponse:
      type: object
      additionalProperties: false
      required: [schema_version, feedback]
      properties:
        schema_version: {type: integer, const: 1}
        feedback:
          oneOf:
            - $ref: "#/components/schemas/Feedback"
            - {type: "null"}
    PreferenceSaveInput:
      type: object
      additionalProperties: false
      required: [schema_version, field, subject]
      properties:
        schema_version: {type: integer, const: 1}
        field:
          type: string
          maxLength: 64
          description: 已知需求字段或 free.* 条目；值与来源由服务端从会话需求状态提取，请求不可传入
        subject:
          type: string
          minLength: 1
          maxLength: 40
          description: self 表示本人，其余为具名代配对象标签，由用户显式选择
    PreferenceSource:
      type: object
      additionalProperties: false
      required: [kind, session_id, message_id, quote]
      properties:
        kind: {type: string, enum: [chat]}
        session_id: {type: string}
        message_id: {type: string}
        quote: {type: string, description: 字段对应的用户原话（消息原文子串）}
    Preference:
      type: object
      additionalProperties: false
      required: [id, subject, field, value, strength, evidence, volatile, source, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        field: {type: string}
        value: {description: 偏好值，任意 JSON}
        strength: {type: string, enum: [prefer, must]}
        evidence: {type: string, enum: [stated, accepted_proposal]}
        volatile: {type: boolean, description: 易失事实必须带 observed_at，召回按新鲜度过滤}
        observed_at: {type: string, format: date}
        source: {$ref: "#/components/schemas/PreferenceSource"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PreferenceSaveResponse:
      type: object
      additionalProperties: false
      required: [schema_version, preference, action]
      properties:
        schema_version: {type: integer, const: 1}
        preference: {$ref: "#/components/schemas/Preference"}
        action: {type: string, enum: [created, superseded, unchanged]}
    PreferenceListResponse:
      type: object
      additionalProperties: false
      required: [schema_version, preferences]
      properties:
        schema_version: {type: integer, const: 1}
        preferences:
          type: array
          items: {$ref: "#/components/schemas/Preference"}
    Run:
      type: object
      additionalProperties: false
      required: [schema_version, id, session_id, kind, status, started_at, events_url]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        session_id: {type: string}
        kind: {type: string, enum: [screening, build, change]}
        status: {type: string, enum: [running, succeeded, failed, interrupted]}
        started_at: {type: string, format: date-time}
        finished_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        events_url: {type: string, format: uri-reference}
    RequirementSource:
      type: object
      additionalProperties: false
      required: [kind, message_id, quote]
      properties:
        kind: {type: string, enum: [chat, edit, confirmed]}
        message_id: {type: string}
        quote: {type: string}
    RequirementField:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        value: {}
        status: {type: string, enum: [unknown, active, removed, conflict]}
        kind: {type: string, enum: [fact, context, constraint]}
        evidence: {type: string, enum: [stated, accepted_proposal, uncertain]}
        strength: {type: string, enum: [must, prefer]}
        scope: {type: string, enum: [session, temporary]}
        source: {$ref: "#/components/schemas/RequirementSource"}
        previous: {$ref: "#/components/schemas/RequirementField"}
        derived_from:
          type: string
          enum: [existing_parts, owned_parts]
          description: 服务端已有件品类与型号的联动来源；用于临时恢复，不接受客户端指定。
    RequirementOperation:
      type: object
      additionalProperties: false
      required: [op, field]
      properties:
        op: {type: string, enum: [set, remove, restore, alternative, conflict]}
        field: {type: string, description: 需求字段路径;保留键 unsupported.monitor|keyboard|mouse 仅接受携带本轮证据的 remove,用于撤销对应 unsupported capability 观察记录}
        value: {}
        strength: {type: string, enum: [must, prefer]}
        scope: {type: string, enum: [session, temporary]}
        quote: {type: string}
        kind:
          type: string
          enum: [fact, context, constraint]
          description: 新增或替换的 context 背景信息仅允许写入 notes、recipient 或 free.*，不能作为预算等固定执行字段；历史读取保持兼容。
        evidence: {type: string, enum: [stated, uncertain, inferred]}
    RequirementAlternative:
      type: object
      additionalProperties: false
      required: [field, value, strength, scope, source]
      properties:
        field: {type: string}
        value: {}
        strength: {type: string, enum: [must, prefer]}
        scope: {type: string, enum: [session, temporary]}
        source: {$ref: "#/components/schemas/RequirementSource"}
        kind: {type: string, enum: [fact, context, constraint]}
    RequirementObservation:
      type: object
      additionalProperties: false
      required: [text, reason, source]
      description: 未能可靠结构化的本轮原文；不代表用户明确约束，解决后不进入生成或下一轮理解。
      properties:
        field: {type: string}
        text: {type: string, minLength: 1}
        reason: {type: string}
        source: {$ref: "#/components/schemas/RequirementSource"}
        resolved: {type: boolean}
    RequirementChange:
      type: object
      additionalProperties: false
      required: [revision, op, field, source]
      properties:
        revision: {type: integer, minimum: 1}
        op: {type: string, enum: [set, remove, restore, alternative, conflict]}
        field: {type: string, description: 需求字段路径;保留键 unsupported.monitor|keyboard|mouse 仅接受携带本轮证据的 remove,用于撤销对应 unsupported capability 观察记录}
        before: {$ref: "#/components/schemas/RequirementField"}
        after: {$ref: "#/components/schemas/RequirementField"}
        source: {$ref: "#/components/schemas/RequirementSource"}
    RequirementState:
      type: object
      additionalProperties: false
      required: [schema_version, revision, fields, alternatives, changes, history]
      description: 仅当前装机会话的需求真值(v2；不持久化 reply/next_action，模型动作无状态权威；v1 由解码边界稳定拒绝)；未知、撤销、冲突字段不被程序默认值覆盖；临时例外可恢复之前的字段。备选讨论不改变当前有效需求。readiness/投影/追问计划的唯一实现见 internal/schemas/requirement_readiness.go。
      properties:
        schema_version: {type: integer, const: 2}
        revision: {type: integer, minimum: 0}
        fields:
          type: object
          additionalProperties: {$ref: "#/components/schemas/RequirementField"}
        alternatives:
          type: array
          items: {$ref: "#/components/schemas/RequirementAlternative"}
        changes:
          type: array
          items: {$ref: "#/components/schemas/RequirementChange"}
        history:
          type: array
          items: {$ref: "#/components/schemas/RequirementChange"}
        observations:
          type: array
          items: {$ref: "#/components/schemas/RequirementObservation"}
    PlanningInput:
      type: object
      required: [schema_version, requirement_state]
      description: |
        确认事务冻结的完整 Builder 执行载荷。字段在确认时全部确定(run ID、
        基线草稿、上一提案、有效选型约束);发送路径只读该载荷,不再用会话草稿
        或最新 build 重组。规范化 hash 记录为 run 的 builder_input_hash。
        requirement_state 仅保留用户事实与溯源;有效选型约束以
        effective_constraints 为准(Builder 的模型输入与确定性门槛都读取它)。
      properties:
        schema_version: {type: integer, const: 2}
        requirement_state: {$ref: "#/components/schemas/RequirementState"}
        effective_constraints:
          oneOf:
            - type: object
              required: [spec, defaults]
              properties:
                spec:
                  $ref: "#/components/schemas/RequirementSpec"
                  description: 确认时冻结的完整核定预览(展开系统默认后的规范化有效 RequirementSpec v2)。
                defaults:
                  type: array
                  description: 被展开的系统默认及来源(origin=system_default);冻结后修改默认规则不改变旧 run 的执行语义。
                  items:
                    type: object
                    required: [field, value, origin]
                    properties:
                      field: {type: string}
                      value: {}
                      origin: {type: string, enum: [system_default]}
            - type: "null"
          description: 确认事务冻结的有效选型约束;失败重试整体继承目标 run 的该字段,仅替换 run 标识。null 仅为历史归档/评估回放兼容。
        base_draft: {type: object, additionalProperties: true}
        previous_proposal: {type: object, additionalProperties: true}
        run_id: {type: string, format: uuid, description: 本轮产品侧 run,生成服务据此归档完整产物}
        previous_run_id: {type: string, format: uuid, description: 上一轮 proposal 的 run,供生成侧从归档补全证据正文}
    PlanningEvidence:
      type: object
      required: [id, url, title, text, captured_at, kind]
      properties:
        id: {type: string}
        url: {type: string}
        title: {type: string}
        text: {type: string}
        captured_at: {type: string}
        kind: {type: string}
        candidate_id: {type: string, description: 关联的配件编号；历史记录可能缺失}
        field: {type: string, description: 资料对应的规格或价格字段}
        final_url: {type: string, description: 实际最终导航地址，历史证据可能缺失}
        reader: {type: string, enum: [http, browser], description: 本次正文读取方式}
        http_status: {type: integer, description: 实际最终页面状态码}
        read_bytes: {type: integer, description: 客户端消费的响应正文大小，不等于浏览器外网流量}
    PlanningCandidate:
      type: object
      description: 会话候选快照。本地候选可含已读取正文支持的缺失规格补充，external仍为false且保留本地报价；field_evidence关联具体字段来源，不代表全局商品已更新。
      required: [id, category, brand, model, specs, price_cny, evidence, external]
      properties:
        id: {type: string}
        category: {$ref: "#/components/schemas/PartCategory"}
        brand: {type: string}
        model: {type: string}
        specs: {type: object, additionalProperties: true}
        price_cny: {type: [string, "null"]}
        evidence: {type: array, items: {type: string}}
        field_evidence: {type: object, additionalProperties: {type: string}}
        field_quotes: {type: object, additionalProperties: {type: string}}
        attributes: {type: object, additionalProperties: true}
        merchant: {type: string}
        currency: {type: string}
        price_observed_at: {type: string}
        unknown: {type: array, items: {type: string}}
        external: {type: boolean}
    PlanningResult:
      type: object
      required: [schema_version, outcome, reply, issues, assumptions, candidates, evidence]
      properties:
        schema_version: {type: integer, const: 1}
        outcome: {type: string, enum: [collect, clarify, proposal, ready, technical_fault, interrupted]}
        model_outcome: {type: string, description: 模型原始意图，不是服务端交付结论}
        build_version: {type: integer, minimum: 1, description: 原子保存后关联的正式版本}
        delivery:
          type: object
          required: [status, issues]
          properties:
            status: {type: string, enum: [not_applicable, unresolved, eligible, delivered, stale]}
            issues: {type: array, items: {type: string}}
        reply: {type: string}
        draft: {type: object, additionalProperties: true}
        assessments:
          type: array
          items:
            type: object
            required: [field, status, explanation, evidence]
            properties:
              field: {type: string}
              status: {type: string, enum: [met, unmet, unknown]}
              explanation: {type: string}
              evidence: {type: array, items: {type: string}}
        issues: {type: array, items: {type: string}}
        assumptions: {type: array, items: {type: string}}
        candidates: {type: array, items: {$ref: "#/components/schemas/PlanningCandidate"}}
        evidence: {type: array, items: {$ref: "#/components/schemas/PlanningEvidence"}}
        validation: {$ref: "#/components/schemas/ValidationReport"}
        quote:
          type: object
          required: [total_cny, missing_count, snapshot_date]
          properties:
            total_cny: {type: string}
            missing_count: {type: integer}
            snapshot_date: {type: string}
            snapshot_id: {type: integer, format: int64, description: 不可变价格批次编号，旧记录可缺省}
        model_calls: {type: integer}
        tool_calls: {type: integer}
        search_calls: {type: integer}
        search_requests: {type: integer}
        page_calls: {type: integer}
        read_attempts:
          type: array
          description: 实际物理读取次数，含失败；自动升级可产生两次，证据续读不产生请求
          items:
            type: object
            required: [method, duration_ms, bytes, status, outcome]
            properties:
              method: {type: string, enum: [http, browser]}
              duration_ms: {type: integer}
              bytes: {type: integer}
              status: {type: integer}
              outcome: {type: string}
        tokens: {type: integer}
        duration_ms: {type: integer}
        stage_ms: {type: object, additionalProperties: {type: integer}}
        builder:
          type: object
          description: 生成服务回传的模型身份(不含部署密钥);旧记录可缺省
          required: [provider, role, model]
          properties:
            provider: {type: string}
            role: {type: string}
            model: {type: string}
        catalog_snapshot_id: {type: integer, format: int64, description: 本轮使用的目录价格快照;缺省为未知}
    SavedPlanningAssessment:
      type: object
      required: [field, status, explanation, evidence]
      properties:
        field: {type: string}
        status: {type: string, enum: [met, unmet, unknown]}
        explanation: {type: string}
        evidence: {type: array, items: {type: string}}
    SessionProposal:
      type: object
      required: [id, requirement, parent_version, created_at, result]
      properties:
        id: {type: integer}
        requirement: {$ref: "#/components/schemas/PlanningInput"}
        parent_version: {type: integer}
        created_at: {type: string}
        result: {$ref: "#/components/schemas/PlanningResult"}
    RequirementSpec:
      type: object
      additionalProperties: false
      required: [schema_version, budget_cny, use_case, configuration_scope]
      properties:
        schema_version: {type: integer, const: 2}
        budget_cny: {type: integer, minimum: 1}
        budget_flex: {type: number, minimum: 0, maximum: 0.3, default: 0.1}
        configuration_scope:
          type: array
          items: {type: string, enum: [tower]}
          minItems: 1
          maxItems: 1
          default: [tower]
          description: 产品能力边界(系统默认注入,非用户陈述);当前仅支持 tower,显示器/键鼠按 unsupported observation 阻塞确认。
        use_case:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [gaming, productivity, general]}
            titles: {type: array, items: {type: string, minLength: 1}, default: [], description: 元素 trim 后非空,去重保序}
            resolution: {type: string, enum: [1080p, 2K, 4K, any], description: any 仅是 RequirementState 的有证据用户值;gaming 组合校验拒绝 any}
            performance_goal: {type: string, enum: [balanced, fps_first, quality_first], default: balanced, description: 仅 gaming 未明确时使用系统默认 balanced}
            fps_target: {type: integer, minimum: 1}
          allOf:
            - if:
                properties:
                  type: {const: gaming}
                required: [type]
              then:
                properties:
                  resolution: {type: string, enum: [1080p, 2K, 4K]}
                required: [resolution]
        size_pref: {type: string, enum: [atx, matx, itx, any], default: any}
        noise_pref: {type: string, enum: [silent, normal, any], default: any}
        brand_pref:
          type: object
          additionalProperties: false
          properties:
            cpu: {type: string, enum: [any, intel, amd], default: any}
            gpu: {type: string, enum: [any, nvidia, amd], default: any}
        existing_parts:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
          default: []
        budget_basis:
          type: string
          enum: [new_purchase, full_build]
          description: 有已有件时必须明确；新增购买费用或整机参考总价。
        owned_parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, model]
            properties:
              category: {$ref: "#/components/schemas/PartCategory"}
              model: {type: string, minLength: 1}
              quantity: {type: integer, minimum: 1, maximum: 8, default: 1}
          description: 每品类一个准确型号；仅 SSD 可多件，其余数量为 1。程序执行前精确绑定并锁定。
        priority:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
          default: []
        notes: {type: string, default: ""}
        constraint_strengths:
          type: object
          additionalProperties: {type: string, enum: [must, prefer]}
          description: 当前有效字段的明确强度，键采用 brand_pref.cpu、size_pref 等需求字段路径；缺失时兼容旧需求语义，不据此认定为用户已表达。
        requirement_semantics:
          type: object
          additionalProperties: {type: string, enum: [fact, context, constraint]}
          description: 用途事实、补充说明或配置条件。must 强度不把事实和说明变成需要目录证明的商品硬条件；旧记录缺少分类时保持未知。
        requirement_observations:
          type: array
          items: {$ref: "#/components/schemas/RequirementObservation"}
          description: 尚未解决的原文及来源，用于理解用途和后续必要确认，不能冒充已核验硬条件。
        requirement_details:
          type: object
          additionalProperties: {type: string}
          properties:
            appearance: {type: string}
            recipient: {type: string}
          description: 当前会话的有效外观、装机对象与 free.* 用户事实；不含已撤销信息、备选方案或长期画像。
    PartCategory:
      type: string
      enum: [cpu, gpu, motherboard, memory, ssd, psu, case, cooler]
    Money:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      examples: ["6419.90"]
    PriceFreshness:
      type: string
      enum: [fresh, aging, stale, unknown]
      description: 按响应时间动态计算；0–7 天 fresh，8–14 天 aging，超过 14 天 stale，缺少观察关联为 unknown。
    PriceFreshnessSummary:
      type: object
      additionalProperties: false
      required: [overall, fresh_count, aging_count, stale_count, unknown_count]
      properties:
        overall: {$ref: "#/components/schemas/PriceFreshness"}
        oldest_observed_date:
          oneOf:
            - {type: string, format: date}
            - {type: "null"}
        max_age_days:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: "null"}
        fresh_count: {type: integer, minimum: 0}
        aging_count: {type: integer, minimum: 0}
        stale_count: {type: integer, minimum: 0}
        unknown_count: {type: integer, minimum: 0}
    BuildSummary:
      type: object
      additionalProperties: false
      required: [schema_version, version, intent, total_cny, snapshot_date, overall_status, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        version: {type: integer, minimum: 1}
        parent_version:
          oneOf:
            - {type: integer, minimum: 1}
            - {type: "null"}
        intent: {type: string}
        total_cny: {$ref: "#/components/schemas/Money"}
        snapshot_date: {type: string, format: date}
        price_freshness: {$ref: "#/components/schemas/PriceFreshness"}
        overall_status: {type: string, enum: [pass, review, fail]}
        created_at: {type: string, format: date-time}
    PartLine:
      type: object
      additionalProperties: false
      required: [category, sku, name, quantity]
      properties:
        owned: {type: boolean, description: 用户已有，无需购买；该行价格仍为参考价。}
        category: {$ref: "#/components/schemas/PartCategory"}
        sku: {type: string}
        name: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_price_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        subtotal_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        rationale: {type: string}
        price_observed_date: {type: string, format: date}
        price_freshness: {$ref: "#/components/schemas/PriceFreshness"}
        price_availability_basis:
          type: string
          enum: [confirmed_stock, search_listing, unknown]
    ValidationCheck:
      type: object
      additionalProperties: false
      required: [rule_id, outcome, severity, observed, missing_fields, detail]
      properties:
        rule_id: {type: string}
        outcome: {type: string, enum: [pass, fail, unknown]}
        severity: {type: string, enum: [none, warning, error]}
        observed: {type: object, additionalProperties: true}
        missing_fields: {type: array, items: {type: string}}
        detail: {type: string}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [overall_status, checks]
      properties:
        overall_status: {type: string, enum: [pass, review, fail]}
        checks:
          type: array
          minItems: 12
          maxItems: 12
          items: {$ref: "#/components/schemas/ValidationCheck"}
    Quote:
      type: object
      additionalProperties: false
      required: [snapshot_date, total_cny, budget_cny, budget_delta_cny, missing_count, missing_skus]
      properties:
        snapshot_id: {type: integer, format: int64, description: 不可变价格批次编号，旧记录可缺省}
        budget_known: {type: boolean}
        purchase_total_cny: {$ref: "#/components/schemas/Money"}
        budget_basis: {type: string, enum: [new_purchase, full_build]}
        snapshot_date: {type: string, format: date}
        total_cny: {$ref: "#/components/schemas/Money"}
        budget_cny: {$ref: "#/components/schemas/Money"}
        budget_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 预算减配置合计;正数表示剩余预算。
        missing_count: {type: integer, minimum: 0}
        missing_skus: {type: array, items: {type: string}}
        price_freshness: {$ref: "#/components/schemas/PriceFreshnessSummary"}
    BuildView:
      type: object
      additionalProperties: false
      required: [schema_version, summary, requirement, parts, quote, validation, disclaimers]
      properties:
        candidate_snapshot:
          type: object
          properties:
            candidates: {type: array, items: {$ref: "#/components/schemas/PlanningCandidate"}}
            evidence: {type: array, items: {$ref: "#/components/schemas/PlanningEvidence"}}
            assessments: {type: array, items: {$ref: "#/components/schemas/SavedPlanningAssessment"}}
            assumptions: {type: array, items: {type: string}}
            reply: {type: string}
        schema_version: {type: integer, const: 1}
        summary: {$ref: "#/components/schemas/BuildSummary"}
        requirement:
          oneOf:
            - $ref: "#/components/schemas/RequirementSpec"
            - $ref: "#/components/schemas/PlanningInput"
        parts:
          type: array
          items: {$ref: "#/components/schemas/PartLine"}
        quote: {$ref: "#/components/schemas/Quote"}
        validation: {$ref: "#/components/schemas/ValidationReport"}
        disclaimers: {type: array, items: {type: string}, minItems: 3}
    DiffLine:
      type: object
      additionalProperties: false
      required: [category, changed, before, after]
      properties:
        category: {$ref: "#/components/schemas/PartCategory"}
        changed: {type: boolean}
        before: {type: string}
        after: {type: string}
        price_delta_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    BuildDiff:
      type: object
      additionalProperties: false
      required: [schema_version, from_version, to_version, lines, total_delta_cny]
      properties:
        schema_version: {type: integer, const: 1}
        from_version: {type: integer, minimum: 1}
        to_version: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 8
          maxItems: 8
          items: {$ref: "#/components/schemas/DiffLine"}
        total_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 目标版本合计减来源版本合计。
        budget_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 目标版本预算减来源版本预算。
        snapshot_warning: {type: string}
    Share:
      type: object
      additionalProperties: false
      required: [schema_version, id, version, token, url, created_at, revoked_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        token: {type: string}
        url: {type: string, format: uri}
        created_at: {type: string, format: date-time}
        revoked_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    ShareRecord:
      type: object
      additionalProperties: false
      required: [schema_version, id, version, created_at, revoked_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        revoked_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    PublicRequirementSummary:
      type: object
      additionalProperties: false
      required: [budget_cny, budget_flex_percent, use_case, size_pref, noise_pref, brand_pref, existing_parts, priority]
      properties:
        known_fields: {type: array, items: {type: string}}
        budget_cny: {$ref: "#/components/schemas/Money"}
