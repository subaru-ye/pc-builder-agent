# P1 数据管道项目(ADR-005:Python 3.12 + uv,边界 = scripts/ 目录)。
# 职责:上游数据适配(D2/D3)、canonical 校验、完整率报告、parts/价格导入(D5/D6)。
# 测试只使用 tests/fixtures 下的冻结数据,禁止实时下载上游(Test Plan 门禁)。
[project]
name = "pcdata"
version = "0.1.0"
description = "装机 Agent P1 数据管道:canonical 校验器、完整率报告、来源锁"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbgpu==2025.12",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcdata"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
