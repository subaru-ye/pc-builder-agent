# golangci-lint v2.12.2(版本锁定见 docs/tech/技术选型.md 回填表;CI 与本地保持同版本)。
# 配置格式为 golangci-lint v2 schema。
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # internal/rules 零 LLM 隔离(CLAUDE.md 工程纪律):
        # 只允许标准库与 internal/schemas,禁止 ADK、模型 SDK、pgx、Redis、agents、store。
        rules-zero-llm:
          list-mode: strict
          files:
            - "**/internal/rules/**"
          allow:
            - $gostd
            - github.com/subaru-ye/pc-builder-agent/internal/schemas
        # 校验 Agent 同为零 LLM 边界(设计方案 §三.3):只允许标准库 + schemas/rules/store,
        # 禁止 ADK、模型 SDK 等;数据访问仅经 store,规则判定仅经 rules。
        validate-agent-zero-llm:
          list-mode: strict
          files:
            - "**/internal/agents/validate/**"
          allow:
            - $gostd
            - github.com/subaru-ye/pc-builder-agent/internal/schemas
            - github.com/subaru-ye/pc-builder-agent/internal/rules
            - github.com/subaru-ye/pc-builder-agent/internal/store

formatters:
  enable:
    - gofmt
