# P0 本地基础设施:PG16+pgvector / Redis7(mvp.md §4.2)
#
# 裁定记录(2026-07-26,文档未写死、实施时裁定):
# - 宿主端口用 15432/16379:本机原生 PostgreSQL 17 与 Redis 服务开机自启,
#   常驻占用 5432/6379,故不用默认端口;容器内端口不变。
# - 账号/密码/库名统一 pcbuilder,仅本地开发用。
# - P1 起库结构(含 vector extension)全部由 goose 编号迁移管理:
#   `go run ./cmd/migrate up`;不再使用 docker-entrypoint-initdb.d。

# 显式固定 compose 项目名,避免目录改名导致项目漂移
name: pc-builder-agent

services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    init: true
    entrypoint: ["python", "/app/pc-reader/reader.py"]
    profiles: ["research"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_ALLOW_INTERNAL_URLS: "false"
      CRAWL4AI_ALLOW_INSECURE_TLS: "false"
      CRAWL4AI_HOOKS_ENABLED: "false"
      CRAWL4AI_EXECUTE_JS_ENABLED: "false"
    volumes:
      - ./deploy/crawl4ai/reader.py:/app/pc-reader/reader.py:ro
    shm_size: "1gb"
    mem_limit: "4g"
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: pcbuilder
      POSTGRES_PASSWORD: pcbuilder
      POSTGRES_DB: pcbuilder
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcbuilder -d pcbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
