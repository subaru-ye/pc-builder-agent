# P0 本地基础设施:PG16+pgvector / Redis7(mvp.md §4.2)
#
# 裁定记录(2026-07-26,文档未写死、实施时裁定;2026-09-23 收束更新):
# - 宿主端口用 15432/16379:本机原生 PostgreSQL 17 与 Redis 服务开机自启,
#   常驻占用 5432/6379,故不用默认端口;容器内端口不变。
#   15432/16379 与本机其他项目(如 caiqs 的 55432)不冲突,且全部绑定
#   127.0.0.1,不对局域网暴露;局域网演示只转发 Web 端口。
# - 账号/密码/库名统一 pcbuilder,仅本地开发用。
# - 全部服务收束在本文件单个 compose stack(name: pc-builder-agent):
#   默认只起 postgres/redis;crawl4ai 走 research profile;本地 Auth
#   (gotrue + 一次性 bootstrap)走 auth profile,不再使用独立覆盖文件。
# - P1 起库结构(含 vector extension)全部由 goose 编号迁移管理:
#   `go run ./cmd/migrate up`;不再使用 docker-entrypoint-initdb.d。

# 显式固定 compose 项目名,避免目录改名导致项目漂移
name: pc-builder-agent

services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    init: true
    entrypoint: ["python", "/app/pc-reader/reader.py"]
    profiles: ["research"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_ALLOW_INTERNAL_URLS: "false"
      CRAWL4AI_ALLOW_INSECURE_TLS: "false"
      CRAWL4AI_HOOKS_ENABLED: "false"
      CRAWL4AI_EXECUTE_JS_ENABLED: "false"
    volumes:
      - ./deploy/crawl4ai/reader.py:/app/pc-reader/reader.py:ro
    shm_size: "1gb"
    mem_limit: "4g"
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: pcbuilder
      POSTGRES_PASSWORD: pcbuilder
      POSTGRES_DB: pcbuilder
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcbuilder -d pcbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 本地 Auth(auth profile;原 docker-compose.auth.yml,2026-09-23 收束合入)----
  auth-db-init:
    image: pgvector/pgvector:pg16
    profiles: ["auth"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pcbuilder
    volumes:
      - ./ops/auth/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-h", "postgres", "-U", "pcbuilder", "-d", "pcbuilder", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.196.0
    profiles: ["auth"]
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://pcbuilder:pcbuilder@postgres:5432/pcbuilder?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
