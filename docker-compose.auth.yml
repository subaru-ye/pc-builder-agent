services:
  auth-db-init:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pcbuilder
    volumes:
      - ./ops/auth/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-h", "postgres", "-U", "pcbuilder", "-d", "pcbuilder", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://pcbuilder:pcbuilder@postgres:5432/pcbuilder?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
