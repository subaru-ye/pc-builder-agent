openapi: 3.1.0
info:
  title: PC Builder Agent Product API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    产品 API 契约。P7 会话、run、SSE 与配置读取、P9 分享，以及本地 Supabase Auth 账号接口均已实现。
    浏览器不得绕过本契约直接依赖 ADK/A2A 线格式。
servers:
  - url: /
    description: 同源入口;本地由 Next.js rewrite 转发至 Go :8082
tags:
  - name: health
    description: 进程与依赖健康状态
  - name: sessions
    description: 匿名产品会话、消息与需求确认
  - name: runs
    description: 后台 Agent 运行与 SSE 事件
  - name: builds
    description: 配置版本、diff 与 Markdown 导出
  - name: shares
    description: 只读分享的创建、撤销与公开读取
  - name: auth
    description: 本地 Supabase Auth 账号与服务端认证会话
paths:
  /healthz:
    get:
      summary: 检查 API 进程存活
      tags: [health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      summary: 检查完整依赖就绪状态
      tags: [health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: 完整依赖可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 未就绪或处于降级状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      summary: 读取账号功能与当前登录状态
      tags: [auth]
      operationId: getAuthState
      responses:
        "200":
          description: 当前身份；未启用或未登录也返回 200
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/register:
    post:
      summary: 邮箱密码注册并认领当前匿名数据
      tags: [auth]
      operationId: registerAccount
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: 注册成功并设置服务端认证会话 Cookie
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      summary: 邮箱密码登录并认领当前匿名数据
      tags: [auth]
      operationId: loginAccount
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      summary: 退出登录并旋转匿名身份
      tags: [auth]
      operationId: logoutAccount
      responses:
        "204": {description: 已退出}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/profile:
    patch:
      summary: 更新显示名称
      tags: [auth]
      operationId: updateAccountProfile
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRequest"}
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthState"}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password/change:
    post:
      summary: 校验当前密码后修改密码
      tags: [auth]
      operationId: changeAccountPassword
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeRequest"}
      responses:
        "204": {description: 密码已修改，当前会话已替换}
        "4XX": {$ref: "#/components/responses/Problem"}
  /api/v1/sessions:
    post:
      summary: 创建匿名产品会话
      tags: [sessions]
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 会话已创建;必要时同时设置匿名身份 cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      summary: 列出当前匿名用户的会话
      tags: [sessions]
      operationId: listSessions
      responses:
        "200":
          description: 当前匿名用户的会话
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, sessions]
                properties:
                  schema_version: {type: integer, const: 1}
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/SessionSummary"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 读取一个产品会话
      tags: [sessions]
      operationId: getSession
      responses:
        "200":
          description: 会话详情、消息、待确认需求和活动 run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 发送消息并启动初筛或改单 run
      tags: [sessions]
      operationId: createMessageRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, text]
              properties:
                schema_version: {type: integer, const: 1}
                text: {type: string, minLength: 1, maxLength: 4000}
      responses:
        "200":
          description: 幂等命中已完成的同一 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: run 已开始或幂等命中运行中的 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/requirement:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    patch:
      summary: 完整替换待确认需求
      tags: [sessions]
      operationId: replacePendingRequirement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: 只允许 requirement_ready;请求体为完整替换而非 merge patch。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RequirementSpec"}
      responses:
        "200":
          description: 严格校验并保存后的需求
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RequirementSpec"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/requirement/confirm:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      summary: 确认需求并启动生成 run
      tags: [sessions]
      operationId: confirmRequirement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 幂等命中已完成 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: build run 已开始
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: 读取后台 run 状态
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: 当前匿名用户所属 run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}/feedback:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: 读取自己的运行反馈
      tags: [runs]
      operationId: getRunFeedback
      responses:
        "200":
          description: 当前反馈；未提交时为 null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      summary: 提交或修改已结束运行的负反馈
      description: 同一运行只保留一份反馈；相同内容重复提交不重复创建，修改原因不更换证据。反馈不等于已批准的评估标准答案。
      tags: [runs]
      operationId: submitRunFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackInput"}
      responses:
        "200":
          description: 反馈已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackResponse"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: Last-Event-ID
        in: header
        required: false
        description: SSE 重连游标;从其后一条事件开始。
        schema: {type: string}
    get:
      summary: 订阅并重放 run 事件
      tags: [runs]
      operationId: streamRunEvents
      responses:
        "200":
          description: 事件细节见 SSE事件协议.md
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
            X-Accel-Buffering:
              schema: {type: string, const: "no"}
          content:
            text/event-stream:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      summary: 列出会话的配置版本
      tags: [builds]
      operationId: listBuilds
      responses:
        "200":
          description: 版本树摘要,按 version 升序
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, builds]
                properties:
                  schema_version: {type: integer, const: 1}
                  builds:
                    type: array
                    items: {$ref: "#/components/schemas/BuildSummary"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    get:
      summary: 读取聚合配置版本
      tags: [builds]
      operationId: getBuild
      responses:
        "200":
          description: 聚合配置读模型
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuildView"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/diff:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - name: from
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      - name: to
        in: query
        required: true
        schema: {type: integer, minimum: 1}
    get:
      summary: 比较任意两个配置版本
      tags: [builds]
      operationId: getBuildDiff
      responses:
        "200":
          description: 两版本逐品类 diff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BuildDiff"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/export.md:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    get:
      summary: 下载一个版本的 Markdown
      tags: [builds]
      operationId: exportBuildMarkdown
      responses:
        "200":
          description: 与 cmd/builds 共用 presenter 的 Markdown
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/markdown; charset=utf-8:
              schema: {type: string}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/shares:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
    post:
      summary: 创建固定版本的只读分享
      tags: [shares]
      operationId: createBuildShare
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 新分享;原始 token 只在响应和 URL 中出现
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Share"}
        "200":
          description: 相同幂等键的既有分享
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Share"}
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      summary: 列出当前用户对固定版本创建过的分享
      tags: [shares]
      operationId: listBuildShares
      responses:
        "200":
          description: 包含活动和已撤销记录;不返回 token 或 URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, shares]
                properties:
                  schema_version: {type: integer, const: 1}
                  shares:
                    type: array
                    items: {$ref: "#/components/schemas/ShareRecord"}
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/sessions/{session_id}/builds/{version}/shares/{share_id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
      - $ref: "#/components/parameters/Version"
      - $ref: "#/components/parameters/ShareID"
    delete:
      summary: 按所有者分享 ID 撤销旧链接
      tags: [shares]
      operationId: revokeBuildShareById
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 已撤销;重复撤销保持幂等
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    delete:
      summary: 撤销当前用户拥有的分享
      tags: [shares]
      operationId: revokeBuildShare
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 已撤销;重复撤销保持幂等
        "4XX":
          $ref: "#/components/responses/Problem"
  /api/v1/public/shares/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      summary: 公开读取一份只读配置
      tags: [shares]
      operationId: getPublicBuildShare
      security: []
      responses:
        "200":
          description: 不含会话、用户、聊天与内部 ID 的公开配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicBuildView"}
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/public/shares/{token}/export.md:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      summary: 公开下载固定分享版本的 Markdown
      tags: [shares]
      operationId: exportPublicBuildShareMarkdown
      security: []
      responses:
        "200":
          description: 与所有者导出和 cmd/builds 共用 presenter
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/markdown; charset=utf-8:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    anonymousCookie:
      type: apiKey
      in: cookie
      name: pcb_anonymous_id
    authSessionCookie:
      type: apiKey
      in: cookie
      name: pcb_auth_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    SessionID:
      name: session_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RunID:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Version:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ShareToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    ShareID:
      name: share_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC problem details;404 同时用于不存在与无权访问
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [schema_version, status]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, const: ok}
    Readiness:
      type: object
      additionalProperties: false
      required: [schema_version, status, dependencies]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, enum: [ready, degraded, unavailable]}
        dependencies:
          type: object
          additionalProperties: false
          required: [postgres, redis, buildsvc]
          properties:
            postgres: {type: string, enum: [ok, unavailable]}
            redis: {type: string, enum: [ok, degraded, unavailable]}
            buildsvc: {type: string, enum: [ok, unavailable]}
            auth: {type: string, enum: [ok, unavailable]}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          enum:
            - invalid_request
            - not_found
            - session_busy
            - invalid_session_phase
            - schema_validation_failed
            - upstream_unavailable
            - context_expired
            - run_timeout
            - run_interrupted
            - generation_failed
            - events_expired
            - internal_error
            - auth_disabled
            - auth_invalid_credentials
            - auth_email_exists
            - auth_weak_password
            - auth_session_expired
            - auth_unavailable
        request_id: {type: string}
    Account:
      type: object
      additionalProperties: false
      required: [id, email, display_name, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1, maxLength: 40}
        created_at: {type: string, format: date-time}
    AuthState:
      type: object
      additionalProperties: false
      required: [schema_version, enabled, authenticated, account, claimed_session_count]
      properties:
        schema_version: {type: integer, const: 1}
        enabled: {type: boolean}
        authenticated: {type: boolean}
        account:
          oneOf:
            - {$ref: "#/components/schemas/Account"}
            - {type: "null"}
        claimed_session_count: {type: integer, minimum: 0}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [schema_version, email, password, display_name]
      properties:
        schema_version: {type: integer, const: 1}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 10, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 40}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [schema_version, email, password]
      properties:
        schema_version: {type: integer, const: 1}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128}
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [schema_version, display_name]
      properties:
        schema_version: {type: integer, const: 1}
        display_name: {type: string, minLength: 1, maxLength: 40}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, current_password, new_password, confirm_password]
      properties:
        schema_version: {type: integer, const: 1}
        current_password: {type: string, minLength: 1, maxLength: 128}
        new_password: {type: string, minLength: 10, maxLength: 128}
        confirm_password: {type: string, minLength: 10, maxLength: 128}
    SessionPhase:
      type: string
      enum: [collecting, requirement_ready, building, ready, changing, error]
    SessionSummary:
      type: object
      additionalProperties: false
      required: [schema_version, id, title, phase, created_at, updated_at, version_count]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string}
        title: {type: string}
        phase: {$ref: "#/components/schemas/SessionPhase"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version_count: {type: integer, minimum: 0}
    Session:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          required: [messages, pending_requirement, active_run, last_error, recovery_phase, degraded]
          properties:
            messages:
              type: array
              items: {$ref: "#/components/schemas/Message"}
            pending_requirement:
              oneOf:
                - $ref: "#/components/schemas/RequirementSpec"
                - type: "null"
            active_run:
              oneOf:
                - $ref: "#/components/schemas/Run"
                - type: "null"
            last_error:
              oneOf:
                - $ref: "#/components/schemas/Problem"
                - type: "null"
            recovery_phase:
              oneOf:
                - type: string
                  enum: [collecting, requirement_ready, ready]
                - type: "null"
            degraded: {type: boolean}
    Message:
      type: object
      additionalProperties: false
      required: [schema_version, id, role, content, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        run_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: "null"}
        created_at: {type: string, format: date-time}
    FeedbackReason:
      type: string
      enum: [unnecessary_question, requirement_mismatch, configuration_issue, price_issue, unclear_explanation, other]
    FeedbackInput:
      type: object
      additionalProperties: false
      required: [schema_version, reason]
      properties:
        schema_version: {type: integer, const: 1}
        reason: {$ref: "#/components/schemas/FeedbackReason"}
        comment: {type: string, maxLength: 2000, description: 选择 other 时必须填写非空说明}
    Feedback:
      type: object
      additionalProperties: false
      required: [id, run_id, reason, comment, fingerprint, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        reason: {$ref: "#/components/schemas/FeedbackReason"}
        comment: {type: string, maxLength: 2000}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FeedbackResponse:
      type: object
      additionalProperties: false
      required: [schema_version, feedback]
      properties:
        schema_version: {type: integer, const: 1}
        feedback:
          oneOf:
            - $ref: "#/components/schemas/Feedback"
            - {type: "null"}
    Run:
      type: object
      additionalProperties: false
      required: [schema_version, id, session_id, kind, status, started_at, events_url]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        session_id: {type: string}
        kind: {type: string, enum: [screening, build, change]}
        status: {type: string, enum: [running, succeeded, failed, interrupted]}
        started_at: {type: string, format: date-time}
        finished_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        events_url: {type: string, format: uri-reference}
    RequirementSpec:
      type: object
      additionalProperties: false
      required: [schema_version, budget_cny, use_case]
      properties:
        schema_version: {type: integer, const: 1}
        budget_cny: {type: integer, minimum: 1}
        budget_flex: {type: number, minimum: 0, maximum: 0.3, default: 0.1}
        use_case:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [gaming, productivity, general]}
            titles: {type: array, items: {type: string}, default: []}
            resolution: {type: string, enum: [1080p, 2K, 4K]}
            fps_target: {type: integer, minimum: 1}
          allOf:
            - if:
                properties:
                  type: {const: gaming}
                required: [type]
              then:
                properties:
                  resolution: {type: string, enum: [1080p, 2K, 4K]}
                required: [resolution]
        size_pref: {type: string, enum: [atx, matx, itx, any], default: any}
        noise_pref: {type: string, enum: [silent, normal, any], default: any}
        brand_pref:
          type: object
          additionalProperties: false
          properties:
            cpu: {type: string, enum: [any, intel, amd], default: any}
            gpu: {type: string, enum: [any, nvidia, amd], default: any}
        existing_parts:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
          default: []
        budget_basis:
          type: string
          enum: [new_purchase, full_build]
          description: 有已有件时必须明确；新增购买费用或整机参考总价。
        owned_parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, model]
            properties:
              category: {$ref: "#/components/schemas/PartCategory"}
              model: {type: string, minLength: 1}
              quantity: {type: integer, minimum: 1, maximum: 8, default: 1}
          description: 每品类一个准确型号；仅 SSD 可多件，其余数量为 1。程序执行前精确绑定并锁定。
        priority:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
          default: []
        notes: {type: string, default: ""}
    PartCategory:
      type: string
      enum: [cpu, gpu, motherboard, memory, ssd, psu, case, cooler]
    Money:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      examples: ["6419.90"]
    PriceFreshness:
      type: string
      enum: [fresh, aging, stale, unknown]
      description: 按响应时间动态计算；0–7 天 fresh，8–14 天 aging，超过 14 天 stale，缺少观察关联为 unknown。
    PriceFreshnessSummary:
      type: object
      additionalProperties: false
      required: [overall, fresh_count, aging_count, stale_count, unknown_count]
      properties:
        overall: {$ref: "#/components/schemas/PriceFreshness"}
        oldest_observed_date:
          oneOf:
            - {type: string, format: date}
            - {type: "null"}
        max_age_days:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: "null"}
        fresh_count: {type: integer, minimum: 0}
        aging_count: {type: integer, minimum: 0}
        stale_count: {type: integer, minimum: 0}
        unknown_count: {type: integer, minimum: 0}
    BuildSummary:
      type: object
      additionalProperties: false
      required: [schema_version, version, intent, total_cny, snapshot_date, overall_status, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        version: {type: integer, minimum: 1}
        parent_version:
          oneOf:
            - {type: integer, minimum: 1}
            - {type: "null"}
        intent: {type: string}
        total_cny: {$ref: "#/components/schemas/Money"}
        snapshot_date: {type: string, format: date}
        price_freshness: {$ref: "#/components/schemas/PriceFreshness"}
        overall_status: {type: string, enum: [pass, review, fail]}
        created_at: {type: string, format: date-time}
    PartLine:
      type: object
      additionalProperties: false
      required: [category, sku, name, quantity]
      properties:
        owned: {type: boolean, description: 用户已有，无需购买；该行价格仍为参考价。}
        category: {$ref: "#/components/schemas/PartCategory"}
        sku: {type: string}
        name: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_price_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        subtotal_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        rationale: {type: string}
        price_observed_date: {type: string, format: date}
        price_freshness: {$ref: "#/components/schemas/PriceFreshness"}
        price_availability_basis:
          type: string
          enum: [confirmed_stock, search_listing, unknown]
    ValidationCheck:
      type: object
      additionalProperties: false
      required: [rule_id, outcome, severity, observed, missing_fields, detail]
      properties:
        rule_id: {type: string}
        outcome: {type: string, enum: [pass, fail, unknown]}
        severity: {type: string, enum: [none, warning, error]}
        observed: {type: object, additionalProperties: true}
        missing_fields: {type: array, items: {type: string}}
        detail: {type: string}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [overall_status, checks]
      properties:
        overall_status: {type: string, enum: [pass, review, fail]}
        checks:
          type: array
          minItems: 12
          maxItems: 12
          items: {$ref: "#/components/schemas/ValidationCheck"}
    Quote:
      type: object
      additionalProperties: false
      required: [snapshot_date, total_cny, budget_cny, budget_delta_cny, missing_count, missing_skus]
      properties:
        purchase_total_cny: {$ref: "#/components/schemas/Money"}
        budget_basis: {type: string, enum: [new_purchase, full_build]}
        snapshot_date: {type: string, format: date}
        total_cny: {$ref: "#/components/schemas/Money"}
        budget_cny: {$ref: "#/components/schemas/Money"}
        budget_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 预算减配置合计;正数表示剩余预算。
        missing_count: {type: integer, minimum: 0}
        missing_skus: {type: array, items: {type: string}}
        price_freshness: {$ref: "#/components/schemas/PriceFreshnessSummary"}
    BuildView:
      type: object
      additionalProperties: false
      required: [schema_version, summary, requirement, parts, quote, validation, disclaimers]
      properties:
        schema_version: {type: integer, const: 1}
        summary: {$ref: "#/components/schemas/BuildSummary"}
        requirement: {$ref: "#/components/schemas/RequirementSpec"}
        parts:
          type: array
          items: {$ref: "#/components/schemas/PartLine"}
        quote: {$ref: "#/components/schemas/Quote"}
        validation: {$ref: "#/components/schemas/ValidationReport"}
        disclaimers: {type: array, items: {type: string}, minItems: 3}
    DiffLine:
      type: object
      additionalProperties: false
      required: [category, changed, before, after]
      properties:
        category: {$ref: "#/components/schemas/PartCategory"}
        changed: {type: boolean}
        before: {type: string}
        after: {type: string}
        price_delta_cny:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    BuildDiff:
      type: object
      additionalProperties: false
      required: [schema_version, from_version, to_version, lines, total_delta_cny]
      properties:
        schema_version: {type: integer, const: 1}
        from_version: {type: integer, minimum: 1}
        to_version: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 8
          maxItems: 8
          items: {$ref: "#/components/schemas/DiffLine"}
        total_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 目标版本合计减来源版本合计。
        budget_delta_cny:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: 目标版本预算减来源版本预算。
        snapshot_warning: {type: string}
    Share:
      type: object
      additionalProperties: false
      required: [schema_version, id, version, token, url, created_at, revoked_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        token: {type: string}
        url: {type: string, format: uri}
        created_at: {type: string, format: date-time}
        revoked_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    ShareRecord:
      type: object
      additionalProperties: false
      required: [schema_version, id, version, created_at, revoked_at]
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        revoked_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    PublicRequirementSummary:
      type: object
      additionalProperties: false
      required: [budget_cny, budget_flex_percent, use_case, size_pref, noise_pref, brand_pref, existing_parts, priority]
      properties:
        budget_cny: {$ref: "#/components/schemas/Money"}
        budget_flex_percent: {type: integer, minimum: 0, maximum: 30}
        use_case:
          type: object
          additionalProperties: false
          required: [type, titles, resolution, fps_target]
          properties:
            type: {type: string, enum: [gaming, productivity, general]}
            titles: {type: array, items: {type: string}}
            resolution:
              oneOf:
                - {type: string, enum: [1080p, 2K, 4K]}
                - {type: "null"}
            fps_target:
              oneOf:
                - {type: integer, minimum: 1}
                - {type: "null"}
        size_pref: {type: string, enum: [atx, matx, itx, any]}
        noise_pref: {type: string, enum: [silent, normal, any]}
        brand_pref:
          type: object
          additionalProperties: false
          required: [cpu, gpu]
          properties:
            cpu: {type: string, enum: [any, intel, amd]}
            gpu: {type: string, enum: [any, nvidia, amd]}
        existing_parts:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
        priority:
          type: array
          items: {$ref: "#/components/schemas/PartCategory"}
    PublicBuildSummary:
      type: object
      additionalProperties: false
      required: [schema_version, version, intent_label, total_cny, snapshot_date, overall_status, created_at]
      properties:
        schema_version: {type: integer, const: 1}
        version: {type: integer, minimum: 1}
        parent_version:
          oneOf:
            - {type: integer, minimum: 1}
            - {type: "null"}
        intent_label: {type: string}
        total_cny: {$ref: "#/components/schemas/Money"}
        snapshot_date: {type: string, format: date}
        price_freshness: {$ref: "#/components/schemas/PriceFreshness"}
        overall_status: {type: string, enum: [pass, review, fail]}
        created_at: {type: string, format: date-time}
    PublicValidationCheck:
      type: object
      additionalProperties: false
      required: [rule_id, outcome, severity, missing_fields, detail]
      properties:
        rule_id: {type: string}
        outcome: {type: string, enum: [pass, fail, unknown]}
        severity: {type: string, enum: [none, warning, error]}
        missing_fields: {type: array, items: {type: string}}
        detail: {type: string}
    PublicBuildView:
      description: 独立最小披露 DTO;不含 notes、observed、session/user/chat/run/内部 build id。
      type: object
      additionalProperties: false
      required: [schema_version, summary, requirement, parts, quote, validation, disclaimers, share]
      properties:
        schema_version: {type: integer, const: 1}
        summary: {$ref: "#/components/schemas/PublicBuildSummary"}
        requirement: {$ref: "#/components/schemas/PublicRequirementSummary"}
        parts:
          type: array
          items: {$ref: "#/components/schemas/PartLine"}
        quote: {$ref: "#/components/schemas/Quote"}
        validation:
          type: object
          additionalProperties: false
          required: [overall_status, checks]
          properties:
            overall_status: {type: string, enum: [pass, review, fail]}
            checks:
              type: array
              minItems: 12
              maxItems: 12
              items: {$ref: "#/components/schemas/PublicValidationCheck"}
        disclaimers: {type: array, items: {type: string}, minItems: 3}
        share:
          type: object
          additionalProperties: false
          required: [created_at]
          properties:
            created_at: {type: string, format: date-time}
security:
  - anonymousCookie: []
  - authSessionCookie: []
